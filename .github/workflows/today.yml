name: Today in every calendar

# Rewrites the dated parts of today.html and thirteen-months.html (node _src/build_today.mjs) just after
# midnight Pacific time, so the static pages show today's date in every calendar, and commits only on a change.
# Two runs cover PDT (07:15 UTC) and PST (08:15 UTC); the browser updates the pages to the reader's own date anyway.
on:
  schedule:
    - cron: '15 7,8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today
  cancel-in-progress: false

jobs:
  today:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write the pages
        run: node _src/build_today.mjs
      - name: Commit if changed
        run: |
          set -euo pipefail
          git add today.html thirteen-months.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "today: $(TZ=America/Los_Angeles date +%F)"
          for i in 1 2 3; do git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && exit 0; sleep 5; done
          exit 1
